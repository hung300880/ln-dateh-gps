<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b5e20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>LN DaTeh GPS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="map"></div>

<!-- Thanh trạng thái GPS -->
<div id="status" class="glass">
  <div class="st-row">
    <span id="gpsDot" class="dot off"></span>
    <span id="stCrs" class="st-crs">VN2000</span>
    <span id="stAcc" class="st-acc">--</span>
  </div>
  <div class="st-coords">
    <div><small id="stLa">X</small> <b id="stA">--</b></div>
    <div><small id="stLb">Y</small> <b id="stB">--</b></div>
  </div>
  <div class="st-extra"><span id="stAlt">Cao: --</span><span id="stSpd">V: --</span><span id="stHdg">Hướng: --</span></div>
</div>

<!-- Đang ghi tracklog -->
<div id="trkBadge" class="badge hidden">● REC <span id="trkInfo"></span></div>

<!-- Nút bên phải -->
<div id="rightBtns">
  <button class="fab" id="btnLayers" title="Bản đồ nền">🗺️</button>
  <button class="fab" id="btnCompass" title="La bàn">🧭</button>
  <button class="fab" id="btnLocate" title="Vị trí của tôi">◎</button>
</div>

<!-- Tâm ngắm khi vẽ -->
<div id="crosshair" class="hidden">+</div>

<!-- Bảng vẽ -->
<div id="drawPanel" class="glass hidden">
  <div class="dp-title"><b id="dpTitle">Vẽ vùng</b> <span id="dpMeasure"></span></div>
  <div class="dp-hint" id="dpHint">Chạm bản đồ để thêm đỉnh, hoặc dùng nút GPS</div>
  <div class="dp-btns">
    <button id="dpGps" class="btn">📍 Đỉnh tại GPS</button>
    <button id="dpCenter" class="btn">✚ Đỉnh tâm ngắm</button>
    <button id="dpAuto" class="btn">🚶 Tự động</button>
    <button id="dpUndo" class="btn">↶</button>
    <button id="dpCancel" class="btn danger">✕</button>
    <button id="dpDone" class="btn primary">✔ Xong</button>
  </div>
</div>

<!-- Điều hướng đến điểm -->
<div id="navPanel" class="glass hidden">
  <div><b id="navName">Điểm</b></div>
  <div class="nav-row"><span id="navArrow">⬆</span><div><div id="navDist">--</div><div id="navBrg" class="muted">--</div></div>
  <button id="navStop" class="btn danger">✕</button></div>
</div>

<!-- Thanh công cụ dưới -->
<nav id="toolbar">
  <button data-act="point"><i>📍</i><span>Điểm</span></button>
  <button data-act="line"><i>〰️</i><span>Đường</span></button>
  <button data-act="polygon"><i>⬠</i><span>Vùng</span></button>
  <button data-act="track" id="tbTrack"><i>🛰️</i><span>Tracklog</span></button>
  <button data-act="measure"><i>📐</i><span>Đo</span></button>
  <button data-act="menu"><i>☰</i><span>Menu</span></button>
</nav>

<!-- Bảng trượt (sheet) dùng chung -->
<div id="sheetBg" class="hidden"></div>
<section id="sheet" class="hidden">
  <header><button id="sheetBack" class="icon-btn">‹</button><h2 id="sheetTitle"></h2><button id="sheetClose" class="icon-btn">✕</button></header>
  <div id="sheetBody"></div>
</section>

<div id="toast"></div>
<input type="file" id="fileInput" class="hidden">

<script src="vendor/leaflet.js"></script>
<script src="vendor/proj4.js"></script>
<script src="vendor/togeojson.umd.js"></script>
<script src="vendor/sql-wasm.js"></script>
<script src="vendor/vt.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="vendor/jsQR.js"></script>
<script src="js/crs.js"></script>
<script src="js/db.js"></script>
<script src="js/mbtiles.js"></script>
<script src="js/app.js"></script>
</body>
</html>
